name: training_data_erasure
description: Offline handwriting erasure for study materials (MVP scaffold).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mlkit_document_scanner: ^0.4.0
  image: ^4.3.0
  onnxruntime: ^1.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  pdf: ^3.11.1
  share_plus: ^10.1.4
  sqflite: ^2.4.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/README.txt
