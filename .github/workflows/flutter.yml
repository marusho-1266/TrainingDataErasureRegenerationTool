name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:

defaults:
  run:
    shell: bash
    working-directory: app

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold platform stubs (preserve existing pubspec)
        run: flutter create . --platforms=android --project-name training_data_erasure

      - run: flutter pub get

      - name: dart format
        run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test
